<div class="min-h-screen bg-neutral-950 flex items-center justify-center p-4">
  <div class="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-md p-8 shadow-2xl">
    
    <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-500 mb-6 text-center">
      Iniciar Sesión
    </h2>

    <!-- PESTAÑAS: CLIENTE vs VENDEDOR/LÍDER -->
    <div class="grid grid-cols-2 gap-2 p-1 bg-neutral-950 border border-neutral-800 rounded-xl mb-6">
      <button 
        type="button"
        (click)="tipoIngreso.set('cliente')"
        class="py-2 text-xs font-bold rounded-lg transition-all"
        [class.bg-emerald-500]="tipoIngreso() === 'cliente'"
        [class.text-neutral-950]="tipoIngreso() === 'cliente'"
        [class.text-neutral-400]="tipoIngreso() !== 'cliente'"
      >
        🛍️ Soy Cliente
      </button>

      <button 
        type="button"
        (click)="tipoIngreso.set('vendedor')"
        class="py-2 text-xs font-bold rounded-lg transition-all"
        [class.bg-emerald-500]="tipoIngreso() === 'vendedor'"
        [class.text-neutral-950]="tipoIngreso() === 'vendedor'"
        [class.text-neutral-400]="tipoIngreso() !== 'vendedor'"
      >
        👑 Adminisitrador
      </button>
    </div>

    <form (submit)="iniciarSesion()" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-neutral-400 block mb-1">Correo Electrónico</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          required 
          placeholder="tu@email.com" 
          class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-sm text-neutral-100 focus:outline-none focus:border-emerald-500"
        />
      </div>

      <div>
        <label class="text-xs font-semibold text-neutral-400 block mb-1">Contraseña</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          required 
          placeholder="••••••••" 
          class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-sm text-neutral-100 focus:outline-none focus:border-emerald-500"
        />
      </div>

      <button 
        type="submit" 
        class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold rounded-xl text-sm transition-all shadow-lg shadow-emerald-950/30 mt-2"
      >
        Ingresar como {{ tipoIngreso() === 'vendedor' ? 'Administrador' : 'Cliente' }}
      </button>
    </form>

    <div class="text-center mt-6">
      <a routerLink="/registro" class="text-xs text-neutral-400 hover:text-emerald-400 transition-colors">
        ¿No tenés cuenta? Registrate como cliente
      </a>
    </div>

  </div>
</div>
