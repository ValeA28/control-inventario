<div class="min-h-screen bg-neutral-950 flex items-center justify-center p-4">
  <div class="bg-neutral-900 border border-neutral-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white">Glow & Style</h1>
      <p class="text-neutral-500 text-sm">Inicia sesión para gestionar tu stock</p>
    </div>

    <form (ngSubmit)="iniciarSesion()" class="flex flex-col gap-4">
      <input type="email" [(ngModel)]="email" name="email" placeholder="Correo electrónico" 
             class="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none">
      
      <input type="password" [(ngModel)]="password" name="password" placeholder="Contraseña" 
             class="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none">
      
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg transition-colors">
        Ingresar
      </button>
    </form>
    <a routerLink="/registro" class="text-emerald-400 text-sm block mt-4 text-center">
      ¿No tienes cuenta? Registrate aquí
    </a>
  </div>
</div>
